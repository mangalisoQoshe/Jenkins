services:
  jenkins-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: jenkins
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    ports:
      - 8080:8080
      - 50000:50000
    networks:
      - jenkins_net
  

networks:
  jenkins_net:

volumes:
  jenkins_home: